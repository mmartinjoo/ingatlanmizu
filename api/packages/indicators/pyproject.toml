[project]
name = "ingatlanmizu-indicators"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingatlanmizu.indicators"

[tool.uv.sources]
ingatlanmizu-core = { workspace = true }

[project.scripts] 
ingest-indicators = "ingatlanmizu.indicators.run:main"
