version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: bankmonitor_loans
        columns:
          - name: name
          - name: bank_name
            data_tests:
              - not_null
          - name: available_at
            data_tests:
              - not_null
          - name: apr
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 100
                    inclusive: true
          - name: monthly_installment
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1000000
                    inclusive: true
          - name: full_payable_amount
            data_tests:
              - not_null