version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: mnb_base_rates
        columns:
          - name: valid_from
            data_tests:
              - not_null
          - name: valid_until
            data_tests:
              - not_null
          - name: base_rate
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 100
                    inclusive: true