version: 2

models:
  - name: int_listings__unioned
    description: "All sources unified. Each change is a dedicated row."
    columns:
      - name: source
        description: "Where the listing comes from"
        data_tests:
          - not_null
          - accepted_values:
              values: ['zenga']
              config:
                severity: error
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
  - name: int_listings__current
    description: "Each listing has only the current, most-recent version"
    columns:
      - name: source
        description: "Where the listing comes from"
        data_tests:
          - not_null
          - accepted_values:
              values: ['zenga']
              config:
                severity: error
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
          - unique
  - name: int_listings__price_changes
    description: "Price changes for listings (if any)"
    columns:
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
      - name: price_delta_huf
        description: "Source + listing code"
        data_tests:
          - not_null
