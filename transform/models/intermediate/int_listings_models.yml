version: 2

models:
  - name: int_listing_versions__unioned
    description: "All sources unified. Each change is a dedicated row."    
    data_tests:   # grain = source+listing_code+payload_hash
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source
            - listing_code            
            - payload_hash
    columns:
      - name: source
        description: "Where the listing comes from"
        data_tests:
          - not_null
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
          - unique
  - name: int_listings__current
    description: "Each listing has only the current, most-recent version"
    data_tests:   # grain = source+listing_code+payload_hash
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - listing_key
    columns:
      - name: source
        description: "Where the listing comes from"
        data_tests:
          - not_null
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
          - unique
  - name: int_listings__price_changes
    description: "Price changes for listings (if any)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - listing_key
            - previous_price_huf
            - new_price_huf
    columns:
      - name: listing_key
        description: "Source + listing code"
        data_tests:
          - not_null
      - name: previous_price_huf
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: new_price_huf
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: price_delta_huf
        data_tests:
          - not_null
      - name: price_change_pct
        data_tests:
          - not_null
