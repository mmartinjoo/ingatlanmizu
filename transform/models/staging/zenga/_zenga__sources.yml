version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Append-only landing zone written by the ingestion pipeline."
    tables:
      - name: zenga_listings
        description: "Each change of a listing results in a new record. NOT unique."
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
        columns:
          - name: hirdeteskod
            description: "Source-assigned listing code. The natural key."
            data_tests:
              - not_null
          - name: payload_hash
            description: "sha256 over the important columns of the record"
            data_tests:
              - not_null
          - name: ar
            description: "Unformatted"
            data_tests:
              - not_empty
          - name: alapterulet
            description: "Area in square meter, unformatted"
            data_tests:
              - not_empty
      - name: zenga_observations
        description: "Each time a listing has seen on zenga"
        loaded_at_field: observed_at
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
        columns:
          - name: listing_code
            data_tests:
              - not_null
          - name: observed_at
            data_tests:
              - not_null
          - name: ingestion_run_id
            data_tests:
              - not_null