version: 2

models:
  - name: mart_listings_current
    description: "Every unique listings"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - listing_key
    columns:
      - name: listing_key
        data_tests:
          - not_null
      - name: original_price_huf
        data_tests:
          - not_null
      - name: price_delta_huf
        data_tests:
          - not_null
      - name: price_change_pct
        data_tests:
          - not_null

  - name: mart_market_monthly_by_city
    description: "Monthly median prices by cities"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month_start
            - county
            - city
            - main_type
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
          - not_empty
      - name: main_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['Ház', 'Lakás']
              severity: error
      - name: median_year_of_building
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2100
                inclusive: true
      - name: median_condition_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: new_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: old_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: unknown_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: new_build_ratio
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: mart_market_monthly_by_county
    description: "Monthly median prices by counties"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month_start
            - county
            - main_type
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: main_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['Ház', 'Lakás']
              severity: error
      - name: median_year_of_building
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2100
                inclusive: true
      - name: median_condition_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: new_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: old_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: unknown_build_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: new_build_ratio
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: mart_average_time_on_market
    description: "Average and median days on the market for sold listings"
    columns:
      - name: sold_listings
        data_test:
          - not_null
          - dbt_utils.accepted_range:
            min_value: 0
            inclusive: true
      - name: average_days_on_market
        data_test:
          - dbt_utils.accepted_range:
            min_value: 1
            inclusive: true
      - name: median_days_on_market
        data_test:
          - dbt_utils.accepted_range:
            min_value: 1
            inclusive: true

  - name: mart_market_indicators_monthly
    desciption: "Inflation, base rate, loan affordability"
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: base_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: inflation
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 100
                inclusive: true
      - name: median_apr
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: lowest_apr
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: highest_apr
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: median_monthly_installment
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: lowest_monthly_installment
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: highest_monthly_installment
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
