version: 2

models:
  - name: mart_listings_current
    description: "Every unique listings"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - listing_key
    columns:
      - name: listing_key
        data_tests:
          - not_null
      - name: original_price_huf
        data_tests:
          - not_null
      - name: price_delta_huf
        data_tests:
          - not_null
      - name: price_change_pct
        data_tests:
          - not_null

  - name: mart_market_monthly_by_city
    description: "Monthly median prices by cities"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month_start
            - county
            - city
            - main_type
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
          - not_empty
      - name: main_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['Ház', 'Lakás']
              severity: error

  - name: mart_market_monthly_by_county
    description: "Monthly median prices by counties"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month_start
            - county
            - main_type
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: main_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['Ház', 'Lakás']
              severity: error

  - name: mark_average_time_on_market
    description: "Average and median days on the market for sold listings"
    columns:
      - name: sold_listings
        data_test:
          - not_null
          - dbt_utils.accepted_range:
            min_value: 0
            inclusive: true
      - name: average_days_on_market
        data_test:
          - dbt_utils.accepted_range:
            min_value: 1
            inclusive: true
      - name: median_days_on_market
        data_test:
          - dbt_utils.accepted_range:
            min_value: 1
            inclusive: true
