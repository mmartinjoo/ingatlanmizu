version: 2

models:
  - name: mart_listings_current
    description: "Every unique listings"
    data_tests:   # grain = listing_key
      - dbt_utils.unique_combination_of_columns:
        combination_of_columns:
          - listing_key
    columns:
      - name: listing_key
        data_tests:
          - not_null
      - name: original_price_huf
        data_tests:
          - not_null
      - name: price_delta_huf
        data_tests:
          - not_null
      - name: price_change_pct
        data_tests:
          - not_null
