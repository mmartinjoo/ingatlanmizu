x-common-variables: &env_vars
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_HOST: ${DATABASE_HOST}
  DATABASE_PORT: ${DATABASE_PORT}
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_DB: ${DATABASE_DB}
  ENVIRONMENT: ${ENVIRONMENT}
  LOG_LEVEL: ${LOG_LEVEL}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}

services:
  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - ingest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "./wait-for-it.sh postgres:5432 -t 30 && ./wait-for-it.sh minio:9000 -t 30 && sleep infinity"
    restart: always
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ingest.schedule: "@every 5m"
      ofelia.job-exec.ingest.command: "make runingest"
    volumes:
      - ./db:/usr/src/app/db
      - ./packages:/usr/src/app/packages
      - ./transform:/usr/src/app/transform
      - ./pyproject.toml:/usr/src/app/pyproject.toml
      - ./Makefile:/usr/src/app/Makefile
      - ./.env:/usr/src/app/.env
    depends_on:
      - minio
      - postgres
      - migrate      
    environment: *env_vars

  tansform:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "./wait-for-it.sh postgres:5432 -t 30 && ./wait-for-it.sh minio:9000 -t 30 && sleep infinity"
    restart: always
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ingest.schedule: "0 4 * * *"
      ofelia.job-exec.ingest.command: "make dbt-build"
    volumes:
      - ./db:/usr/src/app/db
      - ./packages:/usr/src/app/packages
      - ./transform:/usr/src/app/transform
      - ./pyproject.toml:/usr/src/app/pyproject.toml
      - ./Makefile:/usr/src/app/Makefile
      - ./.env:/usr/src/app/.env
    depends_on:
      - minio
      - postgres
      - migrate      
    environment: *env_vars

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "./wait-for-it.sh postgres:5432 -t 30 && make migrate"
    depends_on:
      - postgres
    volumes:
      - ./db:/usr/src/app/db
      - ./packages:/usr/src/app/packages
      - ./transform:/usr/src/app/transform
      - ./pyproject.toml:/usr/src/app/pyproject.toml
      - ./Makefile:/usr/src/app/Makefile
      - ./.env:/usr/src/app/.env
    environment: *env_vars

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres/data:/var/lib/postgresql/data/pgdata
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "54321:5432"