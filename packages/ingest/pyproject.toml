[project]
name = "ingatlanmizu-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ingatlanmizu-core",
    "requests>=2.34.2",
    "lxml>=5.3.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingatlanmizu.ingest"

[tool.uv.sources]
ingatlanmizu-core = { workspace = true }

[project.scripts] 
ingest = "ingatlanmizu.ingest.run:main"
