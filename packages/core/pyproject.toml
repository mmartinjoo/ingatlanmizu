[project]
name = "ingatlanmizu-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingatlanmizu.core"

[project.scripts]
migrate = "ingatlanmizu.core.migrate:main"
run = "ingatlanmizu.core.run:main"